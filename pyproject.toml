[project]
name = "Doostan"
version = "2.0.0"
authors = [{ name = "Farhad Fouladi", email = "fouladi@gmx.de" }]
maintainers = [
    { name = "Farhad Fouladi", email = "fouladi@gmx.de" },
]
license = "MIT"
requires-python = ">=3.14"
description = "Doostan - A terminal tool (command line) for managing addresses."
readme = "README.md"
dependencies = [
    "colored~=2.3",
    "duckdb~=2.0",
    "duckdb-engine~=0.17",
    "sqlalchemy~=2.0",
    "textual~=3.0",
]

[project.urls]
"Homepage" = ""

# ruff settings  --------------------------------------
[tool.ruff]
line-length = 120
fix = false
show-fixes = true
target-version = 'py315' # the python version to target, useful when using pyupgrade - default "py310"
extend-exclude = [
]

[tool.ruff.lint]
# E: pycodestyle error, F: pyflakes are 'select'ed by default
extend-select = [
    "W",   # pycodestyle warning
    "I",   # isort - Missing required import (auto-fixable)
    "UP",  # pyupgrade
    "RUF100", # Unused noqa (auto-fixable)
    "A",   # flake8-builtins - shadowing a builtin
    "B",   # flake8-bugbear - likely bugs; includes B904 raise-without-from
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez - naive datetime calls
    "G",   # flake8-logging-format - needs 'logger-objects' below to see our adapters
    "LOG", # flake8-logging
    "PTH", # flake8-use-pathlib
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "TRY", # tryceratops
]
ignore = [
    "UP015", # Unnecessary open mode parameters
    "B019",  # cached-instance-method
    # SIM112 wants UC4_MAIL_Anleihe spelled UC4_MAIL_ANLEIHE. Those mixed-case
    # names are the variables the UC4 scheduler actually sets, so renaming them
    # here without changing every job definition would break deployment.
    "SIM112", # uncapitalized-environment-variables
    # Builtin open() is current Python. Path.open() is a style preference and
    # converting call sites that already hold a str buys nothing.
    "PTH123", # builtin-open
    # Would require a dedicated exception class for every message. That is an
    # architectural opinion we have not adopted.
    "TRY003", # raise-vanilla-args
]

# Each package exposes a 'log' adapter built by log_setup(). Without this ruff
# cannot tell those are loggers, and the entire G ruleset silently reports
# nothing - which is why the f-string log calls went unnoticed for so long.
logger-objects = [
    "dep871m.log",
    "fusion.log",
    "knockout.log",
    "schwellenanpassung.log",
    "stats.log",
    "wmi.log",
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 120

[tool.pytest.ini_options]
pythonpath = "."
# addopts = "--cov-report html"
# addopts = "--capture=no"  # Option (-s) let to see print() output
addopts = ["--cov=doost", "--cov-report", "term-missing"]
testpaths = [
    "tests",
]

[tool.coverage.run]
source = ["doost"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",   # Have to re-enable the standard pragma
    "def __repr__",
    "def __str__",
    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:"
]

[dependency-groups]
dev = [
    "doq>=0.10.0",
    "prek>=0.3.2",
    "pynvim>=0.6.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.10",
    "ty>=0.0.15",
]
